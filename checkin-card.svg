    .task { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1; }
    .title { fill: #172033; font: 800 30px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .summary { fill: #657184; font: 14px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .label { fill: #657184; font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .stat-value { fill: #172033; font: 800 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .task-no { fill: #657184; font: 800 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .chip { fill: #2563eb; font: 800 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .task-title { fill: #172033; font: 800 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .task-id { fill: #657184; font: 12px ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; }
    .task-note { fill: #344054; font: 13px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .latest { fill: #657184; font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
    .due { font: 800 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; text-anchor: middle; }
    .pct { fill: #172033; font: 800 19px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; text-anchor: end; }

<svg xmlns="http://www.w3.org/2000/svg" width="920" height="672" viewBox="0 0 920 672" role="img" aria-label="Task Check-in">
  <style>
    .bg { fill: #f6f7f9; }
    .panel { fill: #ffffff; stroke: #d8e0ea; stroke-width: 1; }
